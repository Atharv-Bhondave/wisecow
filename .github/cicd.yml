name: Wisecow CI-CD Pipeline

# This tells GitHub to run the script every time you push code to the 'main' branch
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from your repository onto GitHub's server
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Log into your personal Docker Hub account so we can upload the image
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build the Docker container and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wisecow-app:latest

      # 4. A helper step to double-check that your Kubernetes files are written correctly
      - name: Test Kubernetes Manifests
        run: |
          echo "Checking if Kubernetes manifests exist..."
          ls k8s/
